name: release

permissions:
  contents: write


on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        run: |
          if [ -z "$KS_BASE64" ]; then
            echo "No release keystore secret configured; building with debug signing."
            exit 0
          fi
          echo "$KS_BASE64" | base64 --decode > android/app/app-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=app-release.keystore
          storePassword=$KS_STORE_PASSWORD
          keyAlias=$KS_KEY_ALIAS
          keyPassword=$KS_KEY_PASSWORD
          EOF
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
